appId: com.sife.app
productName: SIFE
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: node_modules/@xenova/transformers/
    to: transformers/
    filter:
      - "**/*"
